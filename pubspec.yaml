name: omnyserver
description: >-
  Distributed server orchestration platform written in pure Dart. A central Hub
  manages a fleet of Node agents over WebSocket-on-TLS: live monitoring,
  capability detection, presets, formulas and desired-state reconciliation,
  exposed both as first-class Dart APIs and a REST HTTP API. Ships Hub, Node and
  CLI implementations.
version: 0.16.2
repository: https://github.com/OmnyGrid/omnyserver

environment:
  sdk: ^3.12.0

executables:
  omnyserver: omnyserver

dependencies:
  args: ^2.7.0
  cryptography: ^2.9.0
  # Used by 'ai test' to make a live provider request.
  http: ^1.6.0
  dart_service_manager: ^1.3.1
  meta: ^1.19.0
  omnyhub: ^1.7.0
  omnyshell: ^1.57.2
  path: ^1.9.1
  sqlite3: ^2.9.4
  uuid: ^4.6.0
  # The browser half of the API transport seam (`fetch`), so a web dashboard can
  # call the Hub. Reached only through a conditional import, so it never enters a
  # native build's graph.
  web: ^1.1.1
  # Reads a blueprint authored as YAML. CLI-only — the Hub, the wire and the
  # repositories are JSON throughout, and this must stay out of the web barrel's
  # import graph.
  yaml: ^3.1.4

dev_dependencies:
  # Run as an executable by CI (`coverage:test_with_coverage`), never imported.
  coverage: ^1.15.1
  dependency_validator: ^5.0.6
  # Drives the container fleet in test/docker/ — a real Hub and real nodes on a
  # real network, each in its own container. Tagged `docker`, and skipped where
  # no daemon is reachable.
  docker_commander: ^3.0.1
  lints: ^6.1.0
  test: ^1.32.0
