# A small OmnyServer fleet: one Hub and three nodes, each its own container.
#
#   docker compose -f example/docker_fleet/compose.yaml up --build
#
# Run it from the repository root — the build context is the repo, so the image
# is built from the checkout rather than from a published release.
#
# Every service runs the same binary. Which role it plays is the first argument
# and nothing else, which is most of what there is to know about deploying
# OmnyServer.

name: omnyserver-fleet

# Built once from the repository root, and used by every service below.
x-image: &image
  context: ../..
  dockerfile: docker/Dockerfile
  target: runtime

# What every node has in common. The arguments do not belong here — an id and
# a set of labels are the whole difference between one node and the next, and
# an example that hides them behind an anchor is an example of nothing.
x-node: &node
  build: *image
  depends_on: [hub]
  volumes:
    - certs:/certs:ro

services:
  # Issues the dev CA and the Hub's certificate into a volume the others mount,
  # then exits. `hub` waits for it to complete, so `up` needs no preparation
  # step and no certificates on your machine.
  #
  # The certificate is issued for `hub`, which is the name the nodes dial: the
  # nodes verify it for real, and there is no --insecure anywhere below.
  #
  # Issued once and kept. Regenerating on every `up` would hand out a new CA
  # each time — breaking the exception your browser remembers for the Hub, and
  # anything else holding the old one. `down -v` is what starts over.
  certs:
    build: *image
    entrypoint: ["/bin/sh", "-c"]
    command:
      - test -f /certs/server.crt || omnyserver cert gen --out /certs --host hub
    volumes:
      - certs:/certs

  hub:
    build: *image
    depends_on:
      certs:
        condition: service_completed_successfully
    command:
      - hub
      - start
      - --host=0.0.0.0
      - --port=8443
      - --cert=/certs/server.crt
      - --key=/certs/server.key
      # The credential the nodes present, and the one you drive the API with.
      - --grant=node-account:node-token:node
      - --grant=alice:admin-token:admin
      - --api-token=api-secret
      # Persisted into a volume: stop the Hub, start it again, and the fleet,
      # the audit trail and anything issued with `grant add` are still there.
      - --data-dir=/data
      # Worth being told about. Nothing is set by default — a tool that invents
      # its own thresholds is a tool that pages you at 3am.
      - --alert=disk>90
      - --alert=offline for 30s
      # Without this the dashboard gets network errors and nothing else: a
      # browser will not hand a page a cross-origin response unless the server
      # names the origin, and the dashboard is always a different origin than
      # the Hub (:8080 against :8443).
      - --cors-origin=http://localhost:8080
      # An OmnyShell broker beside the REST API, on the same port and the same
      # certificate, so "Open shell" in the dashboard reaches a real terminal
      # on the node. The same grant authenticates against both.
      - --shell
    ports:
      # The API and the node channel share this one TLS port.
      - "8443:8443"
    volumes:
      - certs:/certs:ro
      - hub-data:/data

  # The fleet in a browser: http://localhost:8080
  #
  # `omnyserver_web` compiled to JavaScript and served as static files. It has
  # no backend of its own — the page calls the Hub's API directly with the
  # credentials you sign in with — which is why the Hub needs the
  # --cors-origin above, and why this service is just nginx.
  #
  # The Hub's certificate is self-signed, and a browser owns its own TLS stack:
  # there is no in-page --insecure to offer. Visit https://localhost:8443/healthz
  # once and accept the warning before signing in. See the README.
  dashboard:
    build:
      <<: *image
      target: dashboard
    depends_on: [hub]
    ports:
      - "8080:80"

  # A bare host: nothing installed, so it advertises no capabilities. This is
  # what most of a real fleet looks like.
  worker-1:
    <<: *node
    hostname: worker-1
    command:
      - node
      - start
      - --hub=wss://hub:8443
      - --id=worker-1
      - --principal=node-account
      - --token=node-token
      - --ca=/certs/ca.crt
      # Serves a shell session too, from the same process and the same
      # credentials — this is what the dashboard's terminal attaches to.
      - --with-shell
      - --label=env=prod
      - --label=region=eu

  worker-2:
    <<: *node
    hostname: worker-2
    command:
      - node
      - start
      - --hub=wss://hub:8443
      - --id=worker-2
      - --principal=node-account
      - --token=node-token
      - --ca=/certs/ca.crt
      # Serves a shell session too, from the same process and the same
      # credentials — this is what the dashboard's terminal attaches to.
      - --with-shell
      - --label=env=prod
      - --label=region=us

  # The same agent on a host that has the Dart SDK installed. It discovers that
  # for itself and advertises it, which is how `formula run dart` can succeed
  # here and fail on the two above.
  builder-1:
    <<: *node
    # The one thing this node does not share: it is built from the SDK target,
    # so its host has something on it.
    build:
      <<: *image
      target: sdk
    hostname: builder-1
    command:
      - node
      - start
      - --hub=wss://hub:8443
      - --id=builder-1
      - --principal=node-account
      - --token=node-token
      - --ca=/certs/ca.crt
      # Serves a shell session too, from the same process and the same
      # credentials — this is what the dashboard's terminal attaches to.
      - --with-shell
      - --label=env=staging
      - --label=role=builder

volumes:
  certs:
  hub-data:
