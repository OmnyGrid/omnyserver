# Serves the dashboard, and proxies everything it asks of the Hub.
#
# The browser therefore only ever talks to one origin — http://localhost:8080 —
# which is what makes this example open and work with no certificate to accept
# and no CORS to configure. A page cannot be asked about a certificate for a
# *different* origin, so a self-signed Hub called cross-origin from a browser is
# a dead end: some browsers let you pre-accept it in another tab, Safari does
# not.
#
# The TLS does not go away, it moves: this proxy speaks real `https` to the Hub
# and verifies its certificate against the fleet CA (`proxy_ssl_verify on`).
# That is also how a Hub is usually fronted in production — with the proxy
# holding a publicly-trusted certificate, and the browser none the wiser.

server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # The Hub's certificate is issued for `hub`, so that is the name this must
  # verify against — not the upstream address it happens to resolve to.
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /certs/ca.crt;
  proxy_ssl_name hub;
  proxy_ssl_server_name on;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The dashboard itself: static files, hash-routed, so no SPA fallback.
  location / {
    try_files $uri $uri/ =404;
  }

  location /api/ {
    proxy_pass https://hub:8443/api/;
    # The event stream is long-lived and must not be held in a buffer.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # The terminal. A WebSocket needs the upgrade handshake forwarded verbatim,
  # and a session that idles must not be cut off mid-thought.
  location /shell {
    proxy_pass https://hub:8443/shell;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /healthz {
    proxy_pass https://hub:8443/healthz;
  }
}
