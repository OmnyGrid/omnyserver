# Declares custom test tags used across the suite.
tags:
  # The `version` tag marks the test asserting omnyServerVersion matches
  # pubspec.yaml (test/unit/version_test.dart).
  version:
  # The `sqlite` tag marks tests exercising the SQLite persistence backend.
  sqlite:
  # Platform-scoped tags for monitors/services that only run on one OS.
  linux:
  macos:
  windows:
  # The `docker` tag marks the container fleet tests (test/docker/). They build
  # an image and run a Hub and its nodes as real containers, so they need a
  # Docker daemon and take minutes rather than seconds — run them with
  # `dart test -t docker`, and exclude them elsewhere with `-x docker`. Without
  # a daemon they skip themselves rather than fail.
  docker:
    timeout: 10x
